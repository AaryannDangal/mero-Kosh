name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run test:unit
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-only-secret-not-used-outside-tests
          APP_URL: http://localhost:5173
          CORS_ORIGINS: http://localhost:5173
      # `npm run build` only compiles src/**, so typecheck is what catches
      # breakage in prisma/seed.ts and the test files.
      - run: npm run typecheck
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-only-secret-not-used-outside-tests
          APP_URL: http://localhost:5173
          CORS_ORIGINS: http://localhost:5173
      - run: npm run build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-only-secret-not-used-outside-tests
          APP_URL: http://localhost:5173
          CORS_ORIGINS: http://localhost:5173

  # Guard against the database drifting away from prisma/schema.prisma.
  # A column that exists in schema.prisma but in no migration breaks every
  # query that touches it at runtime, while `migrate deploy` still reports
  # success — so the drift has to be checked explicitly.
  backend-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Apply migrations exactly like production does
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      - name: Fail if the migrated database drifted from prisma/schema.prisma
        run: npx prisma migrate diff --exit-code --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
      - run: npm run test:integration
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
          ALLOW_REMOTE_TEST_RESET: "true"
          JWT_SECRET: ci-only-secret-not-used-outside-tests
          APP_URL: http://localhost:5173
          CORS_ORIGINS: http://localhost:5173
